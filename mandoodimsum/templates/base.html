<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Finance Community</title>

    <!-- Bootstrap CSS -->
    <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
      rel="stylesheet"
    >

</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'posts:index' %}">FinanceHub</a>

    <div class="d-flex">
      {% if request.user.is_authenticated %}
        <span class="navbar-text text-white me-3">
          {{ request.user.username }} 님
        </span>
        <a class="btn btn-warning me-2" href="{% url 'accounts:profile' %}">프로필</a>
        <form action="{% url 'accounts:logout' %}" method="POST">
            {% csrf_token %}
            <button class="btn btn-danger">로그아웃</button>
        </form>
      {% else %}
        <a class="btn btn-outline-light me-2" href="{% url 'accounts:login' %}">로그인</a>
        <a class="btn btn-success" href="{% url 'accounts:signup' %}">회원가입</a>
      {% endif %}
    </div>

  </div>
</nav>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

<!-- Bootstrap JS -->
<script 
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
